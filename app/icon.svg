<svg viewBox="3.24 24.88 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    App-wide favicon (Next.js App Router `app/icon.*` file convention — emitted
    into every route's <head> automatically, no per-page metadata).

    Same artwork as public/streakforge-logo-dark.svg, cropped to a square
    viewBox around the monolith and its spark: the wordmark is dropped because
    at 16px it collapses into an unreadable strip, and its #FFFFFF lettering
    disappears against a light browser tab bar. The towers keep their own
    colours, so this reads on light and dark chrome alike.
  -->
  <defs>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8B8"></stop>
      <stop offset="45%" stop-color="#FFB627"></stop>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <polygon points="25.16,60.45 42.32,69.03 25.16,77.61 8.0,69.03" fill="#E0AAFF"></polygon>
  <polygon points="42.32,69.03 25.16,77.61 25.16,96.33 42.32,87.75" fill="#B14AED"></polygon>
  <polygon points="8.0,69.03 25.16,77.61 25.16,96.33 8.0,87.75" fill="#6A0DAD"></polygon>

  <polygon points="53.24,51.09 70.4,59.67 53.24,68.25 36.08,59.67" fill="#E0AAFF"></polygon>
  <polygon points="70.4,59.67 53.24,68.25 53.24,107.25 70.4,98.67" fill="#B14AED"></polygon>
  <polygon points="36.08,59.67 53.24,68.25 53.24,107.25 36.08,98.67" fill="#6A0DAD"></polygon>

  <polygon points="81.32,41.73 98.48,50.31 81.32,58.89 64.16,50.31" fill="#E0AAFF"></polygon>
  <polygon points="98.48,50.31 81.32,58.89 81.32,121.29 98.48,112.71" fill="#B14AED"></polygon>
  <polygon points="64.16,50.31 81.32,58.89 81.32,121.29 64.16,112.71" fill="#6A0DAD"></polygon>

  <circle cx="81.32" cy="41.73" r="13.26" fill="url(#spark)"></circle>
  <circle cx="81.32" cy="41.73" r="3.51" fill="#FFE8B8"></circle>
</svg>
